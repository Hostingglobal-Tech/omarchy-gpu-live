# AI-OS: 한글 입력기 환경. systemd user environment 로 세션 전체에 주입된다.
#
# Wayland 에서 fcitx5 를 쓰려면 툴킷마다 입력 모듈을 지정해야 한다.
# GTK4/Qt6 는 wayland 네이티브 IM 프로토콜을 쓰므로 GTK_IM_MODULE 을 비워 두는 편이
# 낫지만, 라이브에는 GTK3/Qt5 앱도 섞여 있어 양쪽을 다 잡는 값으로 둔다.
GTK_IM_MODULE=fcitx
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
SDL_IM_MODULE=fcitx
GLFW_IM_MODULE=ibus
INPUT_METHOD=fcitx
