# AI-OS: 이름 해석 폴백.
#
# 라이브 환경에서 systemd-resolved 가 링크별 DNS 를 못 받으면 stub 이 빈 채로
# 남아 이름 해석이 통째로 실패한다. 실측(2026-08-24): tailscale 은 붙었는데
# codex 가 'failed to lookup address information: Try again' 으로 죽었다.
#
# 사장님 지시대로 공용 DNS 를 폴백으로 박는다. DHCP 가 준 DNS 가 있으면
# 그쪽이 먼저 쓰이고, 없을 때만 여기로 떨어진다.
[Resolve]
FallbackDNS=8.8.8.8 1.1.1.1 8.8.4.4 1.0.0.1
DNSStubListener=yes
